<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legendary Pentagram | Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: 'Oswald', sans-serif;
            height: 100%; overflow-x: hidden;
        }

        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #bg-video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .content {
            color: white;
            z-index: 1;
        }

        h1 {
            font-size: clamp(2rem, 10vw, 5rem);
            color: #e63946;
            letter-spacing: 10px;
            margin: 0;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover { background: white; color: black; }

        .about {
            padding: 80px 10%;
            background: #050505;
            color: #888;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <section class="hero">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="videos/hero-video.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <div class="content">
            <h1>The Legendary Pentagram</h1>
            <p style="letter-spacing: 5px;">A DINO MOVIE STUDIOS ORIGINAL</p>
            <a href="https://www.youtube.com/watch?v=7jtr0nLtako" target="_blank" class="btn">WATCH PROLOGUE</a>
        </div>
    </section>

    <section class="about">
        <h2 style="color: #e63946;">SURVIVAL IS SILENT</h2>
        <p>Experience the Cretaceous period like never before. An epic visual journey of five dinosaur factions battling for dominance.</p>
    </section>

</body>
</html>
