<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Legendary Pentagram | Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: 'Oswald', sans-serif;
            height: 100%; overflow: hidden;
        }

        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* كود الفيديو اللي اشتغل في التجربة */
        video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .content {
            color: white;
            z-index: 1;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
        }

        h1 {
            font-size: clamp(2rem, 10vw, 5rem);
            color: #e63946;
            letter-spacing: 10px;
            margin: 0;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <video autoplay muted loop playsinline>
            <source src="videos/hero-video.mp4" type="video/mp4">
        </video>

        <div class="content">
            <h1>The Legendary Pentagram</h1>
            <p style="letter-spacing: 5px;">A DINO MOVIE STUDIOS ORIGINAL</p>
            <a href="https://www.youtube.com/watch?v=7jtr0nLtako" target="_blank" class="btn">WATCH PROLOGUE</a>
        </div>
    </section>

</body>
</html>
