<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legendary Pentagram | Official Website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;700&family=Roboto:wght@300;400&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* واجهة الموقع الرئيسية */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), 
                        url('images/hero-bg.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; 
        }

        .main-logo {
            max-width: 850px; 
            width: 85%;       
            height: auto;
            filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.3)); /* توهج برتقالي خفيف */
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #ccc;
            margin: 5px 0 25px 0;
            text-transform: uppercase;
            font-weight: 300;
        }

        .watch-now-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .watch-label {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
        }

        .youtube-btn {
            background-color: #fff;
            padding: 10px 30px;
            border-radius: 6px;
            transition: 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .youtube-btn img {
            height: 22px; 
            width: auto;
            display: block;
        }

        .youtube-btn:hover {
            transform: scale(1.05);
            /* توهج برتقالي عند الوقوف على الزرار */
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
        }

        /* سيكشن About */
        .about-section {
            padding: 80px 10%;
            background: #000;
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            align-items: center;
        }

        .about-poster { flex: 1; min-width: 300px; max-width: 400px; }
        .about-poster img { 
            width: 100%; 
            border: 1px solid #333; 
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.1);
        }

        .about-info { flex: 2; min-width: 300px; }
        .about-info h2 { 
            font-size: 2.5rem; 
            color: #fff; 
            margin: 0; 
            letter-spacing: 2px; 
            border-left: 5px solid #ff8c00; /* خط برتقالي */
            padding-left: 20px; 
            text-transform: uppercase; 
        }

        .about-info p { font-family: 'Roboto', sans-serif; font-size: 1.1rem; line-height: 1.7; color: #bbb; margin: 20px 0; }

        .crew-info { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            border-top: 1px solid #222; 
            padding-top: 20px; 
        }

        .crew-item h4 { color: #ff8c00; margin: 0; font-size: 0.8rem; text-transform: uppercase; }
        .crew-item p { color: #fff; margin: 5px 0; font-size: 1rem; font-weight: bold; }

        /* سيكشن التريلر المدمج */
        .trailer-section {
            padding: 60px 10%;
            background: #050505;
            text-align: center;
        }

        .trailer-section h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: 5px;
            color: #fff;
            text-transform: uppercase;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* سيكشن الأبطال */
        .factions { padding: 60px 5%; background: #000; }
        .factions h2 { text-align: center; font-size: 2.5rem; margin-bottom: 40px; color: #fff; text-transform: uppercase; }
        .faction-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .faction-card { 
            background: #0a0a0a; 
            padding: 30px 10px; 
            border: 1px solid #1a1a1a; 
            border-bottom: 4px solid #ff8c00; /* حافة برتقالية */
            transition: 0.4s; 
            text-align: center; 
        }
        .faction-card:hover { transform: translateY(-10px); background: #111; border-color: #ff8c00; }
        .faction-card h3 { margin: 0; color: #ff8c00; font-size: 1.6rem; text-transform: uppercase; }
