<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legendary Pentagram | Official Series Website</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            overflow-x: hidden;
            height: 100%;
        }

        /* حاوية الفيديو */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* طبقة سوداء خفيفة فوق الفيديو عشان الكتابة تبان */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            margin: 0;
            letter-spacing: 10px;
            color: #e63946;
            text-transform: uppercase;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.8);
        }

        .btn-red {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <section class="hero">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="images/hero-video.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>The Legendary Pentagram</h1>
            <p style="letter-spacing: 5px;">CRETACEOUS PERIOD</p>
            <a href="https://www.youtube.com/watch?v=7jtr0nLtako" target="_blank" class="btn-red">Watch The Prologue</a>
        </div>
    </section>

</body>
</html>
