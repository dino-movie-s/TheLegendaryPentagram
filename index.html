<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Legendary Pentagram | Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: 'Oswald', sans-serif;
            height: 100%; width: 100%;
            overflow: hidden;
        }

        /* تنسيق المحتوى ليكون فوق الفيديو */
        .content {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10; /* عشان نضمن إنه فوق الفيديو */
            width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 10vw, 5rem);
            color: #e63946;
            letter-spacing: 10px;
            margin: 0;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.9);
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; object-fit: cover; z-index: -1;">
        <source src="videos/hero-video.mp4" type="video/mp4">
    </video>

    <div class="content">
        <h1>The Legendary Pentagram</h1>
        <p style="letter-spacing: 5px; text-shadow: 2px 2px 10px #000;">A DINO MOVIE STUDIOS ORIGINAL</p>
        <a href="https://www.youtube.com/watch?v=7jtr0nLtako" target="_blank" class="btn">WATCH PROLOGUE</a>
    </div>

</body>
</html>
