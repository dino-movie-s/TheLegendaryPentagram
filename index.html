        /* حاوية الفيديو */
        .hero {
            position: relative;

            overflow: hidden;
            background-color: #000; /* لون احتياطي */
        }

        /* كود خلفية الفيديو المحسن */
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            background-size: cover;
        }

        /* طبقة سواد سينمائية */
        .overlay {
