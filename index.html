<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legendary Pentagram | Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            height: 100%;
            background-color: #000;
            font-family: 'Oswald', sans-serif;
        }

        .hero {
            /* استبدل hero-bg.jpg باسم صورتك */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), 
                        url('images/hero-bg.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .content {
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 5.5rem);
            color: #e63946;
            letter-spacing: 12px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.2rem;
            letter-spacing: 5px;
            margin-top: 10px;
            color: #ccc;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 18px 45px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="content">
            <h1>The Legendary Pentagram</h1>
            <p>DINO MOVIE STUDIOS ORIGINAL</p>
            <a href="https://www.youtube.com/watch?v=7jtr0nLtako" target="_blank" class="btn">Watch Prologue</a>
        </div>
    </section>

</body>
</html>
